# Render Blueprint for MediFind Deployment
# See https://render.com/docs/blueprint-spec for documentation

databases:
  - name: medifind-postgres
    databaseName: medifind
    user: medifind_user
    plan: free
    region: oregon # or frankfurt, singapore

services:
  - type: web
    name: medifind
    runtime: python  # 'env' is the deprecated name of this field
    plan: free
    region: oregon
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      # Replace "medifind.onrender.com" with your real Render URL (no wildcards).
      - key: ALLOWED_HOSTS
        value: "medifind.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://medifind.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: medifind-postgres
          property: connectionString
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      # Render's proxy appends the client IP to X-Forwarded-For (used by the login rate limit).
      - key: TRUSTED_PROXY_COUNT
        value: "1"
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Email for password reset (review N6). Fill these in the Render dashboard.
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
